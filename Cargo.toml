[package]
name = "hyprbar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = true }
env_logger = "0.11"
gpui = { git = "https://github.com/zed-industries/zed", rev = "4aad57fd1f002f9feeea2b7fb6229ccbcd576cb1", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4aad57fd1f002f9feeea2b7fb6229ccbcd576cb1", default-features = false, features = ["wayland"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
